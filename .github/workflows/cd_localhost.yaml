name: CD Localhost

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI Version
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Run localhost deployment
        shell: cmd
        run: scripts\deploy_localhost.bat
